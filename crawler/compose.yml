name: booktaste-crawler

services:
  crawler:
    build: .
    networks: [storage]
    environment:
      S3_ENDPOINT_URL: http://storage:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-booktaste}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    restart: on-failure:3

networks:
  storage:
    external: true
    name: storage
